<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GirlFed</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8efe8;--ink:#3a2a26;--dim:#9a8078;--terra:#c26a4a;--line:#ecdccf;--card:#fffdf9}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:46px 16px 64px}
h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:38px}
h1 em{color:var(--terra)}
.sub{font-family:'DM Serif Display',serif;font-style:italic;color:var(--dim);font-size:15px;margin-top:5px}
#plate{width:min(340px,80vw);min-height:150px;margin:26px 0 8px;background:radial-gradient(circle at 50% 42%,#ffffff 55%,#f3ece4 78%,#e7dccd);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;letter-spacing:4px;padding:30px;box-shadow:0 12px 26px rgba(58,42,38,.12);text-align:center;line-height:1.6}
#hud{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--dim);margin:12px 0;text-align:center;line-height:2}
#hud b{color:var(--terra);margin:0 3px}
#order{width:min(560px,94vw);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--terra);border-radius:12px;padding:14px 18px;font-size:13.5px;line-height:1.6}
#order:empty{display:none}
#pantry{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(620px,94vw);margin-top:16px}
#pantry button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-family:inherit;font-size:13px;color:var(--ink);transition:all .15s}
#pantry button:hover{border-color:var(--terra);color:var(--terra)}
#serve{margin-top:18px;padding:14px 30px;border-radius:999px;border:none;background:var(--terra);color:#fff;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .15s}
#serve:hover{background:#a85538}
#log{width:min(560px,94vw);margin-top:16px;font-size:12.5px;color:var(--dim);line-height:1.9;text-align:center}
#log b{color:var(--ink)}
</style>
</head>
<body>
<h1>Girl<em>Fed</em></h1>
<div class="sub">artisanal girl dinner, delivered &middot; no cooking, only vibes</div>
<div id="plate"></div>
<div id="hud"></div>
<div id="order"></div>
<div id="pantry"></div>
<button id="serve">Serve the plate</button>
<div id="log"></div>
<script>
const $=id=>document.getElementById(id);
const ITEMS=[['🧀','cheese cube'],['🥒','pickle'],['🍇','grapes'],['🥕','lone carrot'],['🫒','olives'],['🍫','chocolate'],['🥖','baguette end'],['🍅','cherry tomato'],['🧈','butter (a vibe)'],['🫐','blueberries']];
const ORDERS=[
 'Wants "something that feels like a picnic I didn\'t have to attend."',
 'Requests "a plate with narrative tension."',
 'Asks for "crunchy, briny, and emotionally available."',
 'Wants "the cheese board of a woman with secrets."',
 'Asks for "girl dinner, but make it awards season."',
 'Requests "something my group chat would respect."'];
const S={shift:1,served:0,tips:0,plate:[],over:false};
let order='';
function hud(){$('hud').innerHTML='SHIFT <b>'+S.shift+'</b> &middot; PLATES SERVED <b>'+S.served+'</b> &middot; TIPS <b>$'+S.tips+'</b>';}
function newOrder(){order=ORDERS[Math.floor(Math.random()*ORDERS.length)];
 $('order').innerHTML='<b>Ticket #'+String(100+S.served)+'</b> - '+order;
 S.plate=[];drawPlate();}
function drawPlate(){$('plate').innerHTML=S.plate.map(i=>i[0]).join('');}
function log(t,c){const d=document.createElement('div');d.textContent=t;if(c)d.style.color=c;$('log').prepend(d);}
function pantry(){
 $('pantry').innerHTML='';
 ITEMS.forEach(it=>{const b=document.createElement('button');b.textContent=it[0]+' '+it[1];
  b.onclick=()=>{if(S.plate.length<8){S.plate.push(it);drawPlate();}};$('pantry').appendChild(b);});}
$('serve').onclick=()=>{
 if(S.over)return;
 if(S.plate.length<3){log('The plate judges you. Minimum 3 items. Girl dinner has standards.','#f87171');return;}
 const n=S.plate.length;
 const hasCheese=S.plate.some(i=>i[1].includes('cheese'));
 const hasPickle=S.plate.some(i=>i[1].includes('pickle'));
 const hasChoc=S.plate.some(i=>i[1].includes('chocolate'));
 let tip=n*2+(hasCheese?4:0)+(hasPickle?3:0)+(hasChoc?2:0);
 if(hasCheese&&hasPickle&&hasChoc)tip+=6;
 S.tips+=tip;S.served++;
 const verdict=n>=6?'A maximalist plate. She gasps. $'+tip+' tip.':hasCheese&&hasPickle?'Brine and dairy harmony. $'+tip+' tip.':'Accepted with a slow nod. $'+tip+' tip.';
 log('Served: '+S.plate.map(i=>i[0]).join(' ')+' - '+verdict,'var(--accent)');
 hud();
 if(S.served>=6){end();}else newOrder();};
function end(){S.over=true;
 const avg=Math.round(S.tips/6);
 $('order').innerHTML='<b>SHIFT COMPLETE</b> - Six plates out the door. $'+S.tips+' in tips. '+(avg>=10?'The group chat has heard of you.':'Solid shift. The fridge light is your spotlight.');
 const b=document.createElement('button');b.textContent='WORK ANOTHER SHIFT';
 b.onclick=()=>{Object.assign(S,{shift:S.shift+1,served:0,tips:0,plate:[],over:false});$('log').innerHTML='';newOrder();hud();b.remove();};
 $('pantry').innerHTML='';$('pantry').appendChild(b);}
pantry();newOrder();hud();
</script>
</body>
</html>
